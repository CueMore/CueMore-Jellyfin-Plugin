name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 + .NET 9 + .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "assembly=${VER}.0" >> "$GITHUB_OUTPUT"
          echo "v12=${VER}.1" >> "$GITHUB_OUTPUT"

      - name: Install JPRM
        run: pip install jprm

      - name: Build LTS variant (net8.0 / Jellyfin 10.10.x)
        run: |
          cp build.lts.yaml build.yaml
          sed -i "s|^version:.*|version: \"${{ steps.ver.outputs.assembly }}\"|" build.yaml
          mkdir -p artifacts-lts
          jprm --verbosity=debug plugin build . \
            --output=./artifacts-lts \
            --dotnet-configuration=Release \
            --dotnet-framework=net8.0 \
            --version=${{ steps.ver.outputs.assembly }}
          ORIG=$(ls artifacts-lts/*.zip | head -1)
          mv "$ORIG" "artifacts-lts/$(basename "$ORIG" .zip)_net8.zip"

      - name: Build Stable variant (net9.0 / Jellyfin 10.11.x)
        run: |
          cp build.stable.yaml build.yaml
          sed -i "s|^version:.*|version: \"${{ steps.ver.outputs.assembly }}\"|" build.yaml
          mkdir -p artifacts-stable
          jprm --verbosity=debug plugin build . \
            --output=./artifacts-stable \
            --dotnet-configuration=Release \
            --dotnet-framework=net9.0 \
            --version=${{ steps.ver.outputs.assembly }}
          ORIG=$(ls artifacts-stable/*.zip | head -1)
          mv "$ORIG" "artifacts-stable/$(basename "$ORIG" .zip)_net9.zip"

      - name: Build v12 variant (net10.0 / Jellyfin 12.x)
        run: |
          cp build.v12.yaml build.yaml
          sed -i "s|^version:.*|version: \"${{ steps.ver.outputs.v12 }}\"|" build.yaml
          mkdir -p artifacts-v12
          jprm --verbosity=debug plugin build . \
            --output=./artifacts-v12 \
            --dotnet-configuration=Release \
            --dotnet-framework=net10.0 \
            --version=${{ steps.ver.outputs.v12 }}
          ORIG=$(ls artifacts-v12/*.zip | head -1)
          mv "$ORIG" "artifacts-v12/$(basename "$ORIG" .zip)_net10.zip"

      - name: Upload the three ZIPs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts-lts/*_net8.zip
            artifacts-stable/*_net9.zip
            artifacts-v12/*_net10.zip
          generate_release_notes: true

      - name: Publish manifests to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages "$REPO_URL" gh-pages
          else
            mkdir gh-pages
            ( cd gh-pages && git init -b gh-pages && git remote add origin "$REPO_URL" )
          fi

          if [ ! -f gh-pages/manifest.json ]; then
            ( cd gh-pages && jprm repo init . )
          fi

          OWNER=${GITHUB_REPOSITORY%%/*}
          NAME=${GITHUB_REPOSITORY##*/}
          SOURCE_URL="https://${OWNER}.github.io/${NAME}"

          VERSION="${{ steps.ver.outputs.assembly }}"
          V12_VERSION="${{ steps.ver.outputs.v12 }}"
          mkdir -p gh-pages/marquee

          LTS_DEST="gh-pages/marquee/marquee_${VERSION}_net8.zip"
          STABLE_DEST="gh-pages/marquee/marquee_${VERSION}_net9.zip"
          V12_DEST="gh-pages/marquee/marquee_${V12_VERSION}_net10.zip"
          cp artifacts-lts/*_net8.zip "$LTS_DEST"
          cp artifacts-stable/*_net9.zip "$STABLE_DEST"
          cp artifacts-v12/*_net10.zip "$V12_DEST"

          LTS_SUM=$(md5sum "$LTS_DEST" | awk '{print $1}')
          STABLE_SUM=$(md5sum "$STABLE_DEST" | awk '{print $1}')
          V12_SUM=$(md5sum "$V12_DEST" | awk '{print $1}')
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RELEASES_URL="https://github.com/${GITHUB_REPOSITORY}/releases"

          LTS_ENTRY=$(jq -nc \
            --arg version "$VERSION" \
            --arg changelog "See ${RELEASES_URL}" \
            --arg sourceUrl "${SOURCE_URL}/marquee/marquee_${VERSION}_net8.zip" \
            --arg checksum "$LTS_SUM" \
            --arg timestamp "$TS" \
            '{version:$version, changelog:$changelog, targetAbi:"10.10.7.0", sourceUrl:$sourceUrl, checksum:$checksum, timestamp:$timestamp}')

          STABLE_ENTRY=$(jq -nc \
            --arg version "$VERSION" \
            --arg changelog "See ${RELEASES_URL}" \
            --arg sourceUrl "${SOURCE_URL}/marquee/marquee_${VERSION}_net9.zip" \
            --arg checksum "$STABLE_SUM" \
            --arg timestamp "$TS" \
            '{version:$version, changelog:$changelog, targetAbi:"10.11.8.0", sourceUrl:$sourceUrl, checksum:$checksum, timestamp:$timestamp}')

          V12_ENTRY=$(jq -nc \
            --arg version "$V12_VERSION" \
            --arg changelog "See ${RELEASES_URL}" \
            --arg sourceUrl "${SOURCE_URL}/marquee/marquee_${V12_VERSION}_net10.zip" \
            --arg checksum "$V12_SUM" \
            --arg timestamp "$TS" \
            '{version:$version, changelog:$changelog, targetAbi:"12.0.0.0", sourceUrl:$sourceUrl, checksum:$checksum, timestamp:$timestamp}')

          jq --argjson e "$STABLE_ENTRY" \
            '.[0].versions = ([$e] + (.[0].versions | map(select(.version != $e.version))))' \
            gh-pages/manifest.json > gh-pages/manifest.tmp.json
          mv gh-pages/manifest.tmp.json gh-pages/manifest.json

          jq --argjson e "$V12_ENTRY" \
            '.[0].versions = ([$e] + (.[0].versions | map(select(.version != $e.version))))' \
            gh-pages/manifest.json > gh-pages/manifest.tmp.json
          mv gh-pages/manifest.tmp.json gh-pages/manifest.json

          mkdir -p gh-pages/lts
          if [ ! -f gh-pages/lts/manifest.json ]; then
            ( cd gh-pages && jprm repo init lts )
          fi
          jq --argjson e "$LTS_ENTRY" \
            '.[0].versions = ([$e] + (.[0].versions | map(select(.version != $e.version))))' \
            gh-pages/lts/manifest.json > gh-pages/lts/manifest.tmp.json
          mv gh-pages/lts/manifest.tmp.json gh-pages/lts/manifest.json

          cd gh-pages
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "release: ${{ steps.ver.outputs.assembly }} (LTS + Stable + v12)" || { echo "nothing to commit"; exit 0; }
          git push origin gh-pages
