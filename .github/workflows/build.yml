name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 + .NET 9 + .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "assembly=${VER}.0" >> "$GITHUB_OUTPUT"
          echo "v12=${VER}.0" >> "$GITHUB_OUTPUT"

      - name: Install JPRM
        run: pip install jprm

      - name: Build LTS variant (net8.0 / Jellyfin 10.10.x)
        run: |
          cp build.lts.yaml build.yaml
          sed -i "s|^version:.*|version: \"${{ steps.ver.outputs.assembly }}\"|" build.yaml
          mkdir -p artifacts-lts
          jprm --verbosity=debug plugin build . \
            --output=./artifacts-lts \
            --dotnet-configuration=Release \
            --dotnet-framework=net8.0 \
            --version=${{ steps.ver.outputs.assembly }}
          ORIG=$(ls artifacts-lts/*.zip | head -1)
          mv "$ORIG" "artifacts-lts/cuemore_${{ steps.ver.outputs.assembly }}_net8.zip"

      - name: Build Stable variant (net9.0 / Jellyfin 10.11.x)
        run: |
          cp build.stable.yaml build.yaml
          sed -i "s|^version:.*|version: \"${{ steps.ver.outputs.assembly }}\"|" build.yaml
          mkdir -p artifacts-stable
          jprm --verbosity=debug plugin build . \
            --output=./artifacts-stable \
            --dotnet-configuration=Release \
            --dotnet-framework=net9.0 \
            --version=${{ steps.ver.outputs.assembly }}
          ORIG=$(ls artifacts-stable/*.zip | head -1)
          mv "$ORIG" "artifacts-stable/cuemore_${{ steps.ver.outputs.assembly }}_net9.zip"

      - name: Build v12 variant (net10.0 / Jellyfin 12.x)
        run: |
          cp build.v12.yaml build.yaml
          sed -i "s|^version:.*|version: \"${{ steps.ver.outputs.v12 }}\"|" build.yaml
          mkdir -p artifacts-v12
          jprm --verbosity=debug plugin build . \
            --output=./artifacts-v12 \
            --dotnet-configuration=Release \
            --dotnet-framework=net10.0 \
            --version=${{ steps.ver.outputs.v12 }}
          ORIG=$(ls artifacts-v12/*.zip | head -1)
          mv "$ORIG" "artifacts-v12/cuemore_${{ steps.ver.outputs.v12 }}_net10.zip"

      - name: Upload the three ZIPs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts-lts/*_net8.zip
            artifacts-stable/*_net9.zip
            artifacts-v12/*_net10.zip
          generate_release_notes: true

      - name: Update repository manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.assembly }}"
          V12_VERSION="${{ steps.ver.outputs.v12 }}"
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}"
          DL="${BASE}/releases/download/${TAG}"
          RELEASE_PAGE="${BASE}/releases/tag/${TAG}"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          MD5_LTS=$(md5sum artifacts-lts/*_net8.zip | awk '{print $1}')
          MD5_STABLE=$(md5sum artifacts-stable/*_net9.zip | awk '{print $1}')
          MD5_V12=$(md5sum artifacts-v12/*_net10.zip | awk '{print $1}')

          LTS_ENTRY=$(jq -nc \
            --arg version "$VERSION" \
            --arg changelog "$RELEASE_PAGE" \
            --arg sourceUrl "${DL}/cuemore_${VERSION}_net8.zip" \
            --arg checksum "$MD5_LTS" \
            --arg timestamp "$TS" \
            '{version:$version, changelog:$changelog, targetAbi:"10.10.7.0", sourceUrl:$sourceUrl, checksum:$checksum, timestamp:$timestamp}')

          STABLE_ENTRY=$(jq -nc \
            --arg version "$VERSION" \
            --arg changelog "$RELEASE_PAGE" \
            --arg sourceUrl "${DL}/cuemore_${VERSION}_net9.zip" \
            --arg checksum "$MD5_STABLE" \
            --arg timestamp "$TS" \
            '{version:$version, changelog:$changelog, targetAbi:"10.11.8.0", sourceUrl:$sourceUrl, checksum:$checksum, timestamp:$timestamp}')

          V12_ENTRY=$(jq -nc \
            --arg version "$V12_VERSION" \
            --arg changelog "$RELEASE_PAGE" \
            --arg sourceUrl "${DL}/cuemore_${V12_VERSION}_net10.zip" \
            --arg checksum "$MD5_V12" \
            --arg timestamp "$TS" \
            '{version:$version, changelog:$changelog, targetAbi:"12.0.0.0", sourceUrl:$sourceUrl, checksum:$checksum, timestamp:$timestamp}')

          GUID="7c2e9f4a-1b3d-4e5f-9a8b-2c4d6e8f0a1b"
          DESC="Automatic scrobbling to your CueMore profile. Finished movies and episodes in Jellyfin are marked as watched in CueMore. One-click pairing via code."
          OVERVIEW="Automatic scrobbling to your CueMore profile."
          IMG="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/branding/cuemore.png"

          # Keep version history: merge the new entries with whatever the
          # manifests already list, dedupe by version+ABI (new wins), sort
          # newest-first, and cap each ABI at 8 entries so the file stays small.
          OLD_MAIN=$(jq -c '.[0].versions // []' manifest.json 2>/dev/null || echo '[]')
          OLD_LTS=$(jq -c '.[0].versions // []' lts/manifest.json 2>/dev/null || echo '[]')

          jq -n \
            --arg guid "$GUID" --arg desc "$DESC" --arg overview "$OVERVIEW" --arg img "$IMG" \
            --argjson new "[$V12_ENTRY, $STABLE_ENTRY]" \
            --argjson old "$OLD_MAIN" \
            '[{category:"General", guid:$guid, name:"CueMore", description:$desc, overview:$overview, owner:"CueMore", imageUrl:$img,
               versions: (($new + $old)
                 | unique_by(.version + "|" + .targetAbi)
                 | sort_by(.version | split(".") | map(tonumber)) | reverse
                 | group_by(.targetAbi) | map(.[0:8]) | add
                 | sort_by(.targetAbi))}]' \
            > manifest.json

          mkdir -p lts
          jq -n \
            --arg guid "$GUID" --arg desc "$DESC" --arg overview "$OVERVIEW" --arg img "$IMG" \
            --argjson new "[$LTS_ENTRY]" \
            --argjson old "$OLD_LTS" \
            '[{category:"General", guid:$guid, name:"CueMore", description:$desc, overview:$overview, owner:"CueMore", imageUrl:$img,
               versions: (($new + $old)
                 | unique_by(.version + "|" + .targetAbi)
                 | sort_by(.version | split(".") | map(tonumber)) | reverse
                 | group_by(.targetAbi) | map(.[0:8]) | add
                 | sort_by(.targetAbi))}]' \
            > lts/manifest.json

          git config user.name github-actions
          git config user.email actions@github.com
          git add manifest.json lts/manifest.json
          git commit -m "chore: update plugin manifests for ${TAG}" || { echo "manifests unchanged"; exit 0; }
          # The tag may point at a commit behind main, and the build can leave
          # tracked files dirty — stash them, then cherry-pick the manifest
          # commit onto main so the push is always a fast-forward.
          MANIFEST_COMMIT=$(git rev-parse HEAD)
          git stash push -m "wip" || true
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git checkout -B manifest-push FETCH_HEAD
          git cherry-pick "$MANIFEST_COMMIT"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
